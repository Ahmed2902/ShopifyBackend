name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopify_intelligence_test
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: silent
      RUN_DB_TESTS: 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopify_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d shopify_intelligence_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify migration drift
        run: npm run prisma:migrate:check

      - name: Verify
        run: npm run ci

      - name: Build production container
        run: docker build --target runtime --tag metrico-backend:ci .

      - name: Build migration container
        run: docker build --target migration --tag metrico-migrations:ci .

      - name: Validate production orchestration
        run: |
          cp deploy/backend.env.example deploy/backend.env
          cp deploy/backup.env.example deploy/backup.env
          docker compose --env-file deploy/release.env.example -f deploy/compose.prod.yaml --profile migration --profile backup config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

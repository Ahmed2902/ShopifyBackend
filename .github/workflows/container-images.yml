name: Publish containers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-container-publish
  cancel-in-progress: false

jobs:
  publish:
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      azure_image: ghcr.io/ahmed2902/metrico-backend:${{ steps.release.outputs.azure_tag }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Determine immutable release tag
        id: release
        run: |
          echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "azure_tag=azure-release-$(git rev-parse HEAD)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Require successful main CI for this commit
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireMainCi } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/require-main-ci.mjs`).href);
            const runId = await requireMainCi({ github, repository: context.repo, sha: process.env.RELEASE_SHA, ref: context.ref });
            core.info(`Release commit passed main CI run ${runId}.`);
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API and worker image
        id: runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ahmed2902/metrico-backend:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish matching migration image
        id: migration
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migration
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ahmed2902/metrico-migrations:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=backend
      # Azure's portal requires a name:tag. The commit tag selects the combined
      # startup image while the existing runtime tag keeps its API-only command.
      # A run-specific tag avoids replacing a publication when the same SHA is rebuilt.
      - name: Publish combined Azure image
        id: azure
        uses: docker/build-push-action@v7
        with:
          context: .
          target: azure
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ahmed2902/metrico-backend:azure-${{ steps.release.outputs.tag }}
            ghcr.io/ahmed2902/metrico-backend:${{ steps.release.outputs.azure_tag }}
          cache-from: type=gha,scope=backend
      - name: Record deployable image digests
        env:
          BACKEND_DIGEST: ${{ steps.runtime.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
          AZURE_BACKEND_DIGEST: ${{ steps.azure.outputs.digest }}
        run: |
          echo "BACKEND_IMAGE=ghcr.io/ahmed2902/metrico-backend@$BACKEND_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "MIGRATION_IMAGE=ghcr.io/ahmed2902/metrico-migrations@$MIGRATION_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "AZURE_BACKEND_IMAGE=ghcr.io/ahmed2902/metrico-backend@$AZURE_BACKEND_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "AZURE_BACKEND_TAG=ghcr.io/ahmed2902/metrico-backend:${{ steps.release.outputs.azure_tag }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy backend to Azure
    needs: publish
    if: vars.AZURE_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the current main release and successful CI
        id: gate
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireMainCi } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/require-main-ci.mjs`).href);
            await requireMainCi({ github, repository: context.repo, sha: process.env.RELEASE_SHA, ref: context.ref });
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const current = data.object.sha === process.env.RELEASE_SHA;
            core.setOutput('current', String(current));
            if (!current) core.notice('Skipping outdated Azure release: main has advanced.');
      - name: Validate Azure identity settings
        if: steps.gate.outputs.current == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          node -e "for (const key of ['AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID']) { if (!process.env[key]) throw new Error('Missing repository secret: ' + key); }"
      - name: Log in to Azure with GitHub identity
        if: steps.gate.outputs.current == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the published image and verify the new revision
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SERVICE: backend
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.azure_image }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_CORE_OUTPUT: none
        run: node scripts/deploy-azure.mjs
